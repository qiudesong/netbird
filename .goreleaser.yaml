version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
  - SKIP_LATEST={{ if index .Env "SKIP_LATEST" }}{{ .Env.SKIP_LATEST }}{{ else }}true{{ end }}
  - SKIP_DOCKER_PUSH={{ if index .Env "SKIP_DOCKER_PUSH" }}{{ .Env.SKIP_DOCKER_PUSH }}{{ else }}false{{ end }}
project_name: netbird
builds:
  - id: netbird-wasm
    dir: client/wasm/cmd
    binary: netbird
    env: [GOOS=js, GOARCH=wasm, CGO_ENABLED=0]
    goos:
      - js
    goarch:
      - wasm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird
    dir: client
    binary: netbird
    env: [CGO_ENABLED=0]
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm
      - amd64
      - arm64
      - 386
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # deb and rpm packages target glibc distributions, so on amd64 and arm64, the only
  # architectures with a PKCS#11 driver, they carry the PKCS#11 store, which links libc.
  # Tarballs, the Alpine-based images and the other architectures keep the static build.
  - id: netbird-pkcs11
    dir: client
    binary: netbird
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  # The 32-bit deb architectures, which have no PKCS#11 driver.
  - id: netbird-deb-32bit
    dir: client
    binary: netbird
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - arm
      - 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # Single-arch builds: nfpm provides is not templated, so the RPM splits per arch. The
  # ones with a PKCS#11 driver carry the store like the deb build above.
  - &netbird_rpm_build
    id: netbird-rpm-amd64
    dir: client
    binary: netbird
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  - <<: *netbird_rpm_build
    id: netbird-rpm-arm64
    goarch: [arm64]

  - <<: *netbird_rpm_build
    id: netbird-rpm-arm
    goarch: [arm]
    tags:
      - load_wgnt_from_rsrc

  - <<: *netbird_rpm_build
    id: netbird-rpm-386
    goarch: [386]
    tags:
      - load_wgnt_from_rsrc

  - id: netbird-static
    dir: client
    binary: netbird
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - mips
      - mipsle
      - mips64
      - mips64le
    gomips:
      - hardfloat
      - softfloat
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  - id: netbird-mgmt
    dir: management
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbird-mgmt
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-signal
    dir: signal
    env: [CGO_ENABLED=0]
    binary: netbird-signal
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-relay
    dir: relay
    env: [CGO_ENABLED=0]
    binary: netbird-relay
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-server
    dir: combined
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbird-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-upload
    dir: upload-server
    env: [CGO_ENABLED=0]
    binary: netbird-upload
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-proxy
    dir: proxy/cmd/proxy
    env: [CGO_ENABLED=0]
    binary: netbird-proxy
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.BuildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: nblink
    dir: client/link/cmd/nblink
    env: [CGO_ENABLED=0]
    binary: nblink
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbird-idp-migrate
    dir: tools/idp-migrate
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbird-idp-migrate
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X github.com/netbirdio/netbird/version.versionURL=https://github.com/qiudesong/netbird/releases/latest/download/version -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: netbird

archives:
  - ids:
      - netbird
      - netbird-static
  - id: netbird-wasm
    ids:
      - netbird-wasm
    name_template: "{{ .ProjectName }}_{{ .Version }}"
    formats: [binary]
  - id: netbird-idp-migrate
    ids:
      - netbird-idp-migrate
    name_template: "netbird-idp-migrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: nblink
    ids:
      - nblink
    name_template: "nblink_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # goreleaser archives as tar.gz everywhere unless told otherwise, and
    # nblink is downloaded and extracted by hand on Windows too.
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - maintainer: Netbird <dev@netbird.io>
    description: Netbird client.
    homepage: https://netbird.io/
    license: BSD-3-Clause
    vendor: NetBird
    id: netbird_deb
    package_name: netbird-mod
    conflicts: [netbird]
    replaces: [netbird]
    bindir: /usr/bin
    ids:
      - netbird-pkcs11
      - netbird-deb-32bit
    formats:
      - deb
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"

  - &netbird_rpm
    maintainer: Netbird <dev@netbird.io>
    description: Netbird client.
    homepage: https://netbird.io/
    license: BSD-3-Clause
    vendor: NetBird
    id: netbird_rpm_amd64
    package_name: netbird-mod
    conflicts: [netbird]
    replaces: [netbird]
    bindir: /usr/bin
    ids:
      - netbird-rpm-amd64
    formats:
      - rpm
    # Red Hat certification (RPM Version Handling) requires rpmbuild's ISA
    # provide, which nfpm does not emit. The version is filled in by the release job.
    provides:
      - "netbird-mod(x86-64) = @RPM_EVR@"
    # The client verifies TLS to management and signal against the system trust
    # store. Red Hat software certification (RPM Dependency Tracking) also
    # rejects packages that declare no dependencies at all.
    dependencies:
      - ca-certificates
    # Generated in CI by chglog from git tags; Red Hat certification requires an
    # RPM changelog (RPM Version Handling subtest).
    changelog: changelog.yml
    # License, documentation and a config file so the RPM Provenance subtest sees
    # %license, %doc and %config entries instead of a bare binary.
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/netbird/LICENSE
        type: license
      - src: README.md
        dst: /usr/share/doc/netbird/README.md
        type: doc
      - src: release_files/netbird.sysconfig
        dst: /etc/sysconfig/netbird
        type: config|noreplace
        # May hold the PKCS#11 token PIN (NB_TPM_PIN), so readable by root alone.
        file_info:
          mode: 0600
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"
    rpm:
      summary: NetBird client
      group: Applications/Internet
      packager: NetBird <dev@netbird.io>
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

  - <<: *netbird_rpm
    id: netbird_rpm_arm64
    ids:
      - netbird-rpm-arm64
    provides:
      - "netbird-mod(aarch-64) = @RPM_EVR@"

  - <<: *netbird_rpm
    id: netbird_rpm_arm
    ids:
      - netbird-rpm-arm
    provides:
      - "netbird-mod(armv6hl-32) = @RPM_EVR@"

  - <<: *netbird_rpm
    id: netbird_rpm_386
    ids:
      - netbird-rpm-386
    provides:
      - "netbird-mod(x86-32) = @RPM_EVR@"
dockers_v2:
   - id: netbird
     disable: "{{ .Env.SKIP_DOCKER_PUSH }}"
     ids:
       - netbird
     images:
       - ghcr.io/qiudesong/netbird
     tags:
       - "{{ .Version }}"
       - "{{ if eq .Env.SKIP_LATEST \"false\" }}custom-latest{{ end }}"
     dockerfile: client/Dockerfile
     extra_files:
       - client/netbird-entrypoint.sh
     platforms:
       - linux/amd64
       - linux/arm64
       - linux/arm/6
     annotations:
       "org.opencontainers.image.created": "{{.Date}}"
       "org.opencontainers.image.title": "{{.ProjectName}}"
       "org.opencontainers.image.version": "{{.Version}}"
       "org.opencontainers.image.revision": "{{.FullCommit}}"
       "org.opencontainers.image.source": "{{.GitURL}}"
       "maintainer": "dev@netbird.io"
   - id: netbird-rootless
     disable: "{{ .Env.SKIP_DOCKER_PUSH }}"
     ids:
       - netbird
     images:
       - ghcr.io/qiudesong/netbird
     tags:
       - "{{ .Version }}-rootless"
       - "{{ if eq .Env.SKIP_LATEST \"false\" }}custom-rootless-latest{{ end }}"
     dockerfile: client/Dockerfile-rootless
     extra_files:
       - client/netbird-entrypoint.sh
     platforms:
       - linux/amd64
       - linux/arm64
       - linux/arm/6
     annotations:
       "org.opencontainers.image.created": "{{.Date}}"
       "org.opencontainers.image.title": "{{.ProjectName}}"
       "org.opencontainers.image.version": "{{.Version}}"
       "org.opencontainers.image.revision": "{{.FullCommit}}"
       "org.opencontainers.image.source": "{{.GitURL}}"
       "maintainer": "dev@netbird.io"
   - id: netbird-rootless-ubi
     disable: "{{ .Env.SKIP_DOCKER_PUSH }}"
     ids:
       - netbird
     images:
       - ghcr.io/qiudesong/netbird
