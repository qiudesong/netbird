homebrew_casks:
  - ids:
      - default
    # The tap holds one version, so a patch on an older line must not overwrite it.
    skip_upload: "{{ .Env.SKIP_LATEST }}"
    repository:
      owner: qiudesong
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Netbird
      email: dev@netbird.io
    description: Netbird project.
    homepage: https://netbird.io/
    license: "BSD-3-Clause"
    binaries: [netbird]

uploads:
  - name: debian
    skip: true # Configure independent package hosting before enabling uploads.
    ids:
      - netbird_deb
    mode: archive
    target: https://pkgs.wiretrustee.com/debian/pool/{{ .ArtifactName }};deb.distribution=stable;deb.component=main;deb.architecture={{ if .Arm }}armhf{{ else }}{{ .Arch }}{{ end }};deb.package=
    username: dev@wiretrustee.com
    method: PUT

  - name: yum
    skip: true # Configure independent package hosting before enabling uploads.
    ids:
      - netbird_rpm_amd64
      - netbird_rpm_arm64
      - netbird_rpm_arm
      - netbird_rpm_386
    mode: archive
    target: https://pkgs.wiretrustee.com/yum/{{ .Arch }}{{ if .Arm }}{{ .Arm }}{{ end }}
    username: dev@wiretrustee.com
    method: PUT

checksum:
  name_template: SHA256SUMS
  extra_files:
    - glob: ./infrastructure_files/getting-started-with-zitadel.sh
    - glob: ./release_files/install.sh
    - glob: .release/version
    - glob: .release/release.json
    - glob: .release/signing-key.asc
    - glob: ./infrastructure_files/getting-started.sh
    - glob: ./infrastructure_files/getting-started-enterprise.sh
    - glob: ./infrastructure_files/migrate-to-enterprise.sh

release:
  # The release workflow verifies and promotes these exact draft artifacts.
  # Building an old maintenance release must not move the latest pointers.
  make_latest: false
  # Numbered -custom.N tags are stable fork releases, promoted after verification.
  github:
    owner: qiudesong
    name: netbird
  draft: true
  prerelease: false
  extra_files:
    - glob: ./infrastructure_files/getting-started-with-zitadel.sh
    - glob: ./release_files/install.sh
    - glob: .release/version
    - glob: .release/release.json
    - glob: .release/signing-key.asc
    - glob: ./infrastructure_files/getting-started.sh
    - glob: ./infrastructure_files/getting-started-enterprise.sh
    - glob: ./infrastructure_files/migrate-to-enterprise.sh
