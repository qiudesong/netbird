name: Test release scripts

on:
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "release_files/skip-latest.sh"
      - "release_files/install.sh"
      - "release_files/rpm-provides.sh"
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/sync-main.yml"
      - ".github/workflows/sync-tag.yml"
      - "release_files/tests/**"
      - ".github/workflows/release-scripts-test.yml"
  pull_request:
    paths:
      - "release_files/skip-latest.sh"
      - "release_files/install.sh"
      - "release_files/rpm-provides.sh"
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - ".github/workflows/sync-main.yml"
      - ".github/workflows/sync-tag.yml"
      - "release_files/tests/**"
      - ".github/workflows/release-scripts-test.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Check shell syntax
        run: |
          bash -n release_files/skip-latest.sh
          sh -n release_files/install.sh release_files/rpm-provides.sh
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: v2.16.0
          args: check --config .goreleaser.yaml
      - name: Run bats
        run: bats release_files/tests/
